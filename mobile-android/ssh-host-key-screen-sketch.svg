<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="790" viewBox="0 0 1370 790">
<defs><style>
.bg{fill:#101217}.panel{fill:#151a1e;stroke:#30363c;stroke-width:1.5}.title{fill:#eeefff;font:bold 23px Arial,sans-serif}.white{fill:#eeefff;font:15px Arial,sans-serif}.small{fill:#a7a8aa;font:13px Arial,sans-serif}.orange{fill:#ff5500;font:bold 15px Arial,sans-serif}.input{fill:#1e252a;stroke:#46525c;stroke-width:1}.button{fill:#1e252a;stroke:#46525c;stroke-width:1}
</style></defs>
<rect width="1370" height="790" fill="#0d0f13"/>
<text x="28" y="40" class="title">SSH · подтверждение ключа сервера · эскиз Android</text>
<text x="28" y="64" class="small">Адрес и отпечаток на рисунке обозначены заполнителями</text>
<text x="30" y="95" class="white">Телефон</text>
<rect x="28" y="109" width="370" height="650" rx="17" class="bg" stroke="#555b61" stroke-width="2"/>
<text x="45" y="146" class="title">OsEngine Mobile</text><rect x="43" y="168" width="340" height="3" fill="#fcee21"/>
<text x="45" y="210" class="title">Подключение SSH</text>
