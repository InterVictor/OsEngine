<text x="64" y="444" class="white">SHA256:&lt;отпечаток&gt;</text>
<rect x="64" y="489" width="110" height="44" class="button"/><text x="96" y="517" class="white">Отмена</text>
<rect x="185" y="489" width="174" height="44" class="button"/><text x="213" y="517" class="orange">Доверять ключу</text>
